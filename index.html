<script>
/* ============================================================
   ICONA DELL'APP (Android + iPhone) — PUNTO UNICO DI MODIFICA
   Incolla qui il RAW LINK GitHub dell'icona, tra le virgolette.
   Esempio:
   "https://raw.githubusercontent.com/MarzenegoRiverside/MarzenegoWebpage/main/icon-512.png"
   Consigli: PNG quadrato 512x512 (o 1024x1024), senza trasparenza per iPhone.
   Se lasci vuoto "" viene usato il file apple-touch-icon.png del repository.
   ============================================================ */
var APP_ICON_URL = "https://raw.githubusercontent.com/MarzenegoRiverside/MarzenegoWebpage/main/apple-touch-icon.png";
/* Metti true solo se l'icona ha ~20% di margine attorno al logo (icona "maskable") */
var APP_ICON_MASKABLE = true;

/* Da qui in poi non serve modificare nulla */
(function(){
  try{
    var base = new URL('./', location.href).href;
    var icon = APP_ICON_URL ? new URL(APP_ICON_URL, base).href : new URL('apple-touch-icon.png', base).href;
    var purpose = APP_ICON_MASKABLE ? 'maskable' : 'any';
    var manifest = {
      id: base,
      name: 'Marzenego Riverside',
      short_name: 'Marzenego',
      lang: 'it',
      start_url: base,
      scope: base,
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#000000',
      theme_color: '#0a2a12',
      icons: [
        {src: icon, sizes: '192x192', type: 'image/png', purpose: purpose},
        {src: icon, sizes: '512x512', type: 'image/png', purpose: purpose}
      ]
    };
    var blobUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'}));
    var m = document.querySelector('link[rel="manifest"]');
    if(!m){ m = document.createElement('link'); m.rel = 'manifest'; document.head.appendChild(m); }
    m.href = blobUrl;
    var ati = document.querySelector('link[rel="apple-touch-icon"]');
    if(!ati){ ati = document.createElement('link'); ati.rel = 'apple-touch-icon'; document.head.appendChild(ati); }
    ati.href = icon;
    var fav = document.querySelector('link[rel="icon"]');
    if(!fav){ fav = document.createElement('link'); fav.rel = 'icon'; document.head.appendChild(fav); }
    fav.href = icon;
  }catch(e){ console.warn('Manifest dinamico non creato', e); }
  /* iPhone: la barra in alto prende il colore da qui (solo iOS, Android invariato) */
  try{ if(window.CSS&&CSS.supports('-webkit-touch-callout','none')){ var tc=document.querySelector('meta[name="theme-color"]'); if(tc) tc.setAttribute('content','#1b6b34'); } }catch(e){}
  /* Service worker (file service-worker.js nella stessa cartella): serve a Chrome/Android per "Installa app".
     iPhone: non serve per "Aggiungi alla schermata Home" e il vecchio service worker "passa-tutto" rallentava/bloccava
     i caricamenti -> su iOS viene rimosso. */
  if('serviceWorker' in navigator){
    addEventListener('load', function(){
      var ios=false;try{ios=!!(window.CSS&&CSS.supports('-webkit-touch-callout','none'))}catch(e){}
      if(ios){ navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){}); }
      else navigator.serviceWorker.register('service-worker.js').catch(function(){});
    });
  }
})();
</script>

html.f-mz{--mzt:'MZR','Manrope',sans-serif}html.f-onde{--mzt:'MZR Onde','Manrope',sans-serif}
html.f-mz,html.f-onde{--mzs:'MZR Liscio','Manrope',sans-serif}
:is(.f-mz,.f-onde) .brand{line-height:.86}
:is(.f-mz,.f-onde) .brand b{font-family:var(--mzt);font-size:40px;font-weight:400;letter-spacing:.5px}
:is(.f-mz,.f-onde) .brand i{font-family:'MZR Corsivo',cursive;font-size:38px;line-height:.8;margin-top:-2px}
:is(.f-mz,.f-onde) .brand i::after{content:'~'}  /* coda a onda del fiume dopo Riverside */
:is(.f-mz,.f-onde) .t{font-family:var(--mzt);font-weight:400;letter-spacing:.4px;line-height:1.05}
.f-mz .t{font-size:34px}.f-onde .t{font-size:38px}
:is(.f-mz,.f-onde) .wt1{font-family:var(--mzt);font-size:30px;font-weight:400;letter-spacing:.4px;line-height:1.05}
:is(.f-mz,.f-onde) nav button{font:400 21px var(--mzs);letter-spacing:.4px;padding:5px 14px 3px}
:is(.f-mz,.f-onde) .cm b{font-family:var(--mzs);font-size:23px;font-weight:400;letter-spacing:.4px}
:is(.f-mz,.f-onde) .wm b{font-family:var(--mzs);font-size:17px;font-weight:400;letter-spacing:.4px}
:is(.f-mz,.f-onde) .wl{font-family:var(--mzs);font-size:30px;font-weight:400}
:is(.f-mz,.f-onde) .usr{font:400 24px var(--mzs)}
/* La tua area: lo sfondo si oscura per far capire che e' una schermata a parte (si esce con la X) */
.bg::after{content:'';position:absolute;inset:0;background:#000;opacity:0;transition:opacity .35s ease;pointer-events:none}
html.in-area .bg::after{opacity:.55}
.brand{transition:opacity .35s ease}html.in-area .brand{opacity:.35}
html.in-area .usr.cls{box-shadow:0 0 0 3px var(--ac),0 10px 26px rgba(0,0,0,.35)}
html.in-area .usr.cls .x{background:rgba(0,0,0,.55)}
@media (prefers-reduced-motion:no-preference){html.in-area .usr.cls{animation:xPulse 1.4s ease-out 2}}
@keyframes xPulse{0%{box-shadow:0 0 0 3px var(--ac),0 0 0 0 rgba(255,255,255,.45)}100%{box-shadow:0 0 0 3px var(--ac),0 0 0 18px rgba(255,255,255,0)}}
:root{--ac:#F4C430;--on:#fff;--tx:#EEF3E8;--g:#1E7A3A;--ex:0px;--bgimg:
 radial-gradient(circle at 50% calc((100% - var(--ex))*-.08),#1E7A3A 0,transparent 52%),
 radial-gradient(circle at 105% calc((100% - var(--ex))*.28),rgba(46,140,60,.85) 0,transparent 45%),
 radial-gradient(circle at -5% calc((100% - var(--ex))*.38),color-mix(in srgb,var(--ac) 70%,transparent) 0,transparent 48%),
 radial-gradient(circle at 10% calc((100% - var(--ex))*.82),rgba(30,122,58,.75) 0,transparent 50%)}
*{touch-action:manipulation}[data-a]{cursor:pointer}button,.pill,.btn,.lnk,.usr,nav button,.c.ev,.rw{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#000;min-height:100%}body{min-height:100vh;background:transparent;color:var(--tx);font-family:'Manrope',sans-serif}
.bg{position:fixed;top:0;left:0;right:0;bottom:calc(-1*var(--ex));min-height:calc(100lvh + var(--ex));z-index:-1;background:var(--bgimg),#000;transition:background .4s;transform:translateZ(0)}
#app{max-width:430px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.brand{line-height:.8}.brand b{display:block;font-size:36px;font-weight:700;color:var(--tx)}
.brand i{display:block;font-family:'Alex Brush',cursive;font-style:normal;font-size:36px;color:var(--ac);margin-top:-4px}
/* ======== LIQUID GLASS: materiale base ======== */
.glass{position:relative;isolation:isolate;background:linear-gradient(155deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.04) 45%,rgba(255,255,255,.03) 70%,rgba(255,255,255,.07) 100%);backdrop-filter:blur(12px) saturate(115%);-webkit-backdrop-filter:blur(12px) saturate(115%);border:0;box-shadow:0 10px 26px rgba(0,0,0,.16)}
.glass::before,.back::before{content:'';position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:radial-gradient(110% 55% at 15% -8%,rgba(255,255,255,.09),transparent 60%)}
.glass::after,.back::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:-1;pointer-events:none;background:linear-gradient(150deg,rgba(255,255,255,.5),rgba(255,255,255,.15) 30%,rgba(255,255,255,.06) 60%,rgba(255,255,255,.28));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.usr{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:0;cursor:pointer;color:#fff;overflow:hidden;font:600 20px 'Manrope'}
.usr{position:relative}.usr.glass{background:linear-gradient(155deg,rgba(255,255,255,.17),rgba(255,255,255,.06))}.usr.glass::after{background:linear-gradient(150deg,rgba(255,255,255,.55),rgba(255,255,255,.18) 40%,rgba(255,255,255,.3))}
.usr.cls .uph{filter:blur(1.5px)}
.usr.cls .x{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.4);color:#fff;font:600 30px/1 'Manrope'}
.usr svg{width:28px;height:28px}.usr.lgd{background:var(--ac);color:var(--on,#fff)}.usr img{width:100%;height:100%;object-fit:cover}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px 0 14px;padding:2px}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:none;border:1px solid transparent;border-radius:20px;color:var(--tx);opacity:.6;font:400 19px 'Manrope';padding:4px 14px;cursor:pointer;white-space:nowrap}
nav button.on{opacity:1;font-weight:600;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.38)}
.stack{position:relative;padding-bottom:40px;margin-bottom:14px}
.stack.nb{padding-bottom:0}
.back{position:absolute;inset:0;isolation:isolate;border-radius:34px;background:linear-gradient(150deg,rgba(255,255,255,.07),rgba(255,255,255,.015));backdrop-filter:blur(10px) saturate(115%);-webkit-backdrop-filter:blur(10px) saturate(115%);box-shadow:0 6px 16px rgba(0,0,0,.12);display:flex;align-items:flex-end;padding:0 24px 9px}
.stack.tp{padding:30px 0 0}.stack.tp .back{align-items:flex-start;padding:8px 22px 0}

/* ---------- FOTO GIOCATORE ----------
   Cartelle su GitHub: "foto giocatori/normali" (Home) e "foto giocatori/Esultanze" (La tua area).
   L'abbinamento si fa con il NOME COMPLETO del giocatore (campo "nome" dell'utente, es. "Riccardo Meggiato"),
   NON con lo username (che spesso e' un nickname). Il nome del file puo' essere scritto in molti modi:
   "Riccardo Meggiato.png", "riccardo_meggiato.jpg", "Meggiato Riccardo.webp", "RiccardoMeggiato.png" ... */
const GH="MarzenegoRiverside/MarzenegoWebpage",GBR="main",FBASE="https://raw.githubusercontent.com/"+GH+"/"+GBR+"/";
const FEXT=['png','jpg','jpeg','webp','PNG','JPG','JPEG'],FIMG=/\.(png|jpe?g|webp|gif|avif)$/i;
const nrm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const toks=x=>nrm(x).split(' ').filter(Boolean);

 const nt=toks(nome);if(!nt.length)return'';
 const nj=nt.join(''),ns=[...nt].sort().join(' ');let best='',bs=0;
 files.forEach(f=>{const ft=toks(f.name.replace(/\.[^.]+$/,'')),fj=ft.join('');let sc=0;
  if([...ft].sort().join(' ')===ns)sc=100;                      /* stesso nome (anche cognome-nome) */
  else if(fj===nj)sc=95;                                         /* RiccardoMeggiato */
  else if(nt.every(t=>ft.includes(t)))sc=80-(ft.length-nt.length); /* nome + parole in piu' (es. "esultanza") */
  else if(nt.length>1&&fj.includes(nj))sc=60;
  if(sc>bs){bs=sc;best=f.url}});

}
