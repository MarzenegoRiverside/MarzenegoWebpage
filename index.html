<script>
/* ============================================================
   ICONA DELL'APP (Android + iPhone) — PUNTO UNICO DI MODIFICA
   Incolla qui il RAW LINK GitHub dell'icona, tra le virgolette.
   Esempio:
   "https://raw.githubusercontent.com/MarzenegoRiverside/MarzenegoWebpage/main/icon-512.png"
   Consigli: PNG quadrato 512x512 (o 1024x1024), senza trasparenza per iPhone.
   Se lasci vuoto "" viene usato il file apple-touch-icon.png del repository.
   ============================================================ */
var APP_ICON_URL = "https://raw.githubusercontent.com/MarzenegoRiverside/MarzenegoWebpage/main/apple-touch-icon.png";
/* Metti true solo se l'icona ha ~20% di margine attorno al logo (icona "maskable") */
var APP_ICON_MASKABLE = true;

/* Da qui in poi non serve modificare nulla */
(function(){
  try{
    var base = new URL('./', location.href).href;
    var icon = APP_ICON_URL ? new URL(APP_ICON_URL, base).href : new URL('apple-touch-icon.png', base).href;
    var purpose = APP_ICON_MASKABLE ? 'maskable' : 'any';
    var manifest = {
      id: base,
      name: 'Marzenego Riverside',
      short_name: 'Marzenego',
      lang: 'it',
      start_url: base,
      scope: base,
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#000000',
      theme_color: '#0a2a12',
      icons: [
        {src: icon, sizes: '192x192', type: 'image/png', purpose: purpose},
        {src: icon, sizes: '512x512', type: 'image/png', purpose: purpose}
      ]
    };
    var blobUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'}));
    var m = document.querySelector('link[rel="manifest"]');
    if(!m){ m = document.createElement('link'); m.rel = 'manifest'; document.head.appendChild(m); }
    m.href = blobUrl;
    var ati = document.querySelector('link[rel="apple-touch-icon"]');
    if(!ati){ ati = document.createElement('link'); ati.rel = 'apple-touch-icon'; document.head.appendChild(ati); }
    ati.href = icon;
    var fav = document.querySelector('link[rel="icon"]');
    if(!fav){ fav = document.createElement('link'); fav.rel = 'icon'; document.head.appendChild(fav); }
    fav.href = icon;
  }catch(e){ console.warn('Manifest dinamico non creato', e); }
  /* iPhone: la barra in alto prende il colore da qui (solo iOS, Android invariato) */
  try{ if(window.CSS&&CSS.supports('-webkit-touch-callout','none')){ var tc=document.querySelector('meta[name="theme-color"]'); if(tc) tc.setAttribute('content','#1b6b34'); } }catch(e){}
  /* Service worker (file service-worker.js nella stessa cartella): serve a Chrome/Android per "Installa app".
     iPhone: non serve per "Aggiungi alla schermata Home" e il vecchio service worker "passa-tutto" rallentava/bloccava
     i caricamenti -> su iOS viene rimosso. */
  if('serviceWorker' in navigator){
    addEventListener('load', function(){
      var ios=false;try{ios=!!(window.CSS&&CSS.supports('-webkit-touch-callout','none'))}catch(e){}
      if(ios){ navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){}); }
      else navigator.serviceWorker.register('service-worker.js').catch(function(){});
    });
  }
})();
</script>

.lq .dy.on{background:var(--ac);border-color:var(--ac);box-shadow:0 0 12px color-mix(in srgb,var(--ac) 30%,transparent)}
/* slide Entre' (Home) */
.ph1{position:absolute;right:0;bottom:0;width:50%;height:72%;object-fit:cover;object-position:50% 0;z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(to right,transparent,#000 38%),linear-gradient(to bottom,transparent,#000 24%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 38%),linear-gradient(to bottom,transparent,#000 24%);mask-composite:intersect}
.enb p{max-width:58%}
.bet{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:26px;padding:8px 14px;margin:8px 0 0}
.bet .lg{width:36px}
.bet .pill{font-size:14px;padding:6px 20px;font-weight:500}
.crest{display:block;flex:none}
.hl{background:color-mix(in srgb,var(--ac) 30%,transparent);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:12px 14px;font-size:15px;font-weight:500;line-height:1.3;margin:4px 0 4px}
/* box benvenuto fisso (La tua area) */
.wb{position:relative;overflow:hidden;border-radius:28px;padding:14px 22px;min-height:70px;margin-bottom:12px;display:flex;align-items:center}
.wt1{font-size:24px;font-weight:700;line-height:1.1}.wt2{font-size:15px;font-weight:300;margin-top:2px}
.wph{position:absolute;right:0;top:0;height:100%;width:40%;object-fit:cover;object-position:50% 10%;pointer-events:none;-webkit-mask-image:linear-gradient(to right,transparent,#000 42%);mask-image:linear-gradient(to right,transparent,#000 42%)}
/* pronostico */
.bt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 12px}
.bt b{font-size:15px;font-weight:600;flex:1;line-height:1.2}
.bp{width:128px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:color-mix(in srgb,var(--ac) 30%,transparent);color:var(--tx);font:600 13px 'Manrope';text-align:center;padding:4px 10px;outline:0}
.bp::placeholder{color:rgba(238,243,232,.75);font-weight:500}
.bp.n{width:44px;padding:4px 0}
.sc{display:flex;align-items:center;gap:6px;font-weight:700}
.bs{display:inline-flex;justify-content:center;align-items:center;width:84px}
.bs u{text-decoration:none;opacity:.5;cursor:pointer;padding:0 7px}.bs u.sel{opacity:1;font-weight:800;color:var(--on,#fff)}
.bv{width:auto;min-width:70px;display:inline-block;cursor:default}
/* mappa */
.mpi{margin-bottom:14px}.mph{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mph b{font-size:16px;font-weight:700}
.mpa{margin:2px 0 0;font-size:14px;line-height:1.3}
.cp{background:rgba(255,255,255,.04);font-weight:500;min-width:88px;padding:3px 18px;font-size:13px}
/* ======== iPhone/iPad: alleggerimento grafica (Android invariato) ========
   Safari soffre con tanti "blur" (backdrop-filter) attivi insieme, soprattutto annidati: memoria alta e scatti.
   Dove dietro al vetro c'e' solo lo sfondo sfumato il blur non si vede, quindi lo spengo;
   resta acceso sulla card centrale dei caroselli (dietro ha le card laterali) e sullo sfondo dei popup. */
@supports (-webkit-touch-callout:none){
 .glass,.back,.lq{-webkit-backdrop-filter:none;backdrop-filter:none}
 .cc.act{-webkit-backdrop-filter:blur(12px) saturate(115%);backdrop-filter:blur(12px) saturate(115%)}
 .cc.act.sd{-webkit-backdrop-filter:none;backdrop-filter:none}
}

   salvati dall'ultima apertura) e Firebase si carica in parallelo. Su iPhone si usa il "long polling",
   la modalita' di connessione piu' affidabile con Safari. */

const mkDb=()=>{try{return FS.initializeFirestore(FAPP,IOS?{experimentalForceLongPolling:true}:{})}catch(e){return FS.getFirestore(FAPP)}};
function fbReady(){
 if(db)return Promise.resolve();
 if(!fbP)fbP=(async()=>{
  const[A,F]=await Promise.all([import(FBU+'firebase-app.js'),import(FBU+'firebase-firestore.js')]);
  FS=F;({collection,getDocs,addDoc,doc,setDoc,getDoc,updateDoc,query,where}=F);
  FAPP=A.getApps().length?A.getApp():A.initializeApp(FCFG);
  db=mkDb();FBX=0;
 })().catch(e=>{fbP=null;FBX=1;throw e});
 return fbP;
}
/* se il download di Firebase e' fallito il browser non lo riprova finche' la pagina non viene ricaricata:
   appena la rete risponde di nuovo (e l'utente non sta facendo nulla) ricarico da solo, restando nella stessa sezione */

const netOk=()=>withTO(fetch(FBU+'firebase-app.js',{cache:'no-store'}).then(r=>r.ok),8000).catch(()=>false);

/* se la connessione resta "incastrata" (tipico dopo che l'app e' rimasta in background su iPhone) la ricreo */
async function fbReset(){try{if(!db||!FS)return;const o=db;db=null;fbP=null;await FS.terminate(o).catch(()=>{});await fbReady()}catch(e){}}
/* timeout: nessuna richiesta puo' bloccare l'app all'infinito */
const withTO=(p,ms)=>new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('timeout')),ms);Promise.resolve(p).then(v=>{clearTimeout(t);res(v)},e=>{clearTimeout(t);rej(e)})});
/* lettura "vera" dal server: se Firestore risponde dalla cache (= offline) lo considero un errore e riprovo dopo */
const rows=s=>{if(s.metadata&&s.metadata.fromCache)throw new Error('offline');return s.docs.map(d=>({id:d.id,...d.data()}))};
/* errori "definitivi" (permessi, ecc.): lista vuota come prima, senza riprovare all'infinito */
const soft=e=>{if(e&&/permission-denied|invalid-argument|failed-precondition|not-found/.test(e.code||''))return[];throw e};
const fetchCol=async n=>{await fbReady();try{return rows(await withTO(getDocs(collection(db,n)),15000))}catch(e){return soft(e)}};
const fetchEq=async(c,f,v)=>{if(v==null||v==='')return[];await fbReady();try{return rows(await withTO(getDocs(query(collection(db,c),where(f,"==",v))),15000))}catch(e){return soft(e)}};

/* ---------- DATI: copia locale + aggiornamento automatico ----------
   All'apertura l'app mostra subito i dati dell'ultima volta (Home e Calendario compaiono anche con rete lenta),
   poi li aggiorna da Firebase. Se il caricamento fallisce riprova da sola (2s, 4s, 8s... max 30s)
   e ricarica i dati quando l'app torna in primo piano: non serve piu' chiuderla e riaprirla. */
const DK='mzr_dati_v1',UK='mzr_utente_v1';
const COLS=['eventi','novita','news','risultati','eventiExtra','posizioni','organigramma','prodotti'];
const big=(k,v)=>typeof v==='string'&&v.length>20000?undefined:v;   /* niente immagini base64 enormi nella copia locale */
function saveCache(){try{localStorage.setItem(DK,JSON.stringify({t:Date.now(),D:S.D},big))}catch(e){try{localStorage.removeItem(DK)}catch(x){}}}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(DK)||'null');if(c&&c.D)COLS.forEach(k=>{if(Array.isArray(c.D[k]))S.D[k]=c.D[k]})}catch(e){}}
const uStore=()=>{try{return localStorage.getItem(SK)?localStorage:sessionStorage}catch(e){return null}};
function cacheUser(){if(!S.u)return;try{const st=uStore();st&&st.setItem(UK,JSON.stringify({id:S.uid,d:S.ud}))}catch(e){}}
function cachedUser(un){try{const st=uStore(),c=st&&JSON.parse(st.getItem(UK)||'null');return c&&c.d&&c.d.username===un?c:null}catch(e){return null}}
function dropUserCache(){try{localStorage.removeItem(UK);sessionStorage.removeItem(UK)}catch(e){}}
async function loadAll(){
 const r=await Promise.allSettled(COLS.map(fetchCol));
 r.forEach((x,i)=>{if(x.status==='fulfilled')S.D[COLS[i]]=x.value});
 S.D.eventi.sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora));
 if(r.some(x=>x.status==='fulfilled'))saveCache();
 return r.every(x=>x.status==='fulfilled');
}
async function loadUser(){
 if(!S.u)return true;
 const u=S.u;
 const r=await Promise.allSettled([fetchEq("messaggi","destinatario",u.username),fetchEq('candidature','nome',u.nome),fetchEq('richieste_prodotti','nomeUtente',u.nome),fetchEq("presenze","username",u.username)]);
 if(S.u!==u)return true;
 const[m,c,o,vt]=r.map(x=>x.status==='fulfilled'?x.value:null);
 if(m)S.msgs=m.sort((a,b)=>b.timestamp-a.timestamp);
 if(c)S.cand=c;
 if(o)S.ord=o;
 if(vt){S.votes=new Set(vt.map(x=>x.eventoId));S.vst=new Map(vt.map(x=>[x.eventoId,x.stato]))}
 return r.every(x=>x.status==='fulfilled');
}
/* rilegge il profilo dell'utente collegato (tema, foto, note...) */
async function syncUser(){
 if(!S.ss)return true;
 const un=S.ss,s=await fetchEq("utenti","username",un);
 if(S.ss!==un)return true;
 if(!s.length){if(S.u){S.u=null;S.uid=null;S.ud={};S.fm={};S.votes=null;S.vst=null;S.msgs=[];S.cand=[];S.ord=[];setTema(TEMA_DEF)}return true}
 const{id,...d}=s[0],was=S.u&&S.u.nome;
 setUser(d,id);cacheUser();
 if(was!==S.u.nome||!S.fm||!(S.fm.st===0||S.fm.st===1))resolveFoto().then(patchFoto).catch(()=>{});
 return await loadUser();
}
let RF=null,RT=0,TRY=0,LAST=0;
const sig=()=>{try{return JSON.stringify([S.D,S.u,S.ud,S.msgs,S.cand,S.ord,S.vst?[...S.vst]:0])}catch(e){return String(Math.random())}};
function refresh(){
 if(RF)return RF;
 clearTimeout(RT);
 RF=(async()=>{
  const s0=sig();let ok=false;
  try{
   if(TRY>=2&&!S.pw&&navigator.onLine!==false)await fbReset();
   try{await withTO(fbReady(),25000)}
   catch(e){if(FBX&&calm()&&await netOk()&&calm()&&healReload())return;throw e}
   const r=await Promise.allSettled([loadAll(),syncUser()]);
   ok=r.every(x=>x.status==='fulfilled'&&x.value);
  }catch(e){console.warn('Aggiornamento dati non riuscito',e)}
  if(sig()!==s0)softRender();else hdr();
  if(ok){TRY=0;LAST=Date.now()}
  else{TRY++;RT=setTimeout(refresh,Math.min(30000,2000*2**(TRY-1)))}
 })().finally(()=>{RF=null});
 return RF;
}

function setTema(c){const r=document.documentElement.style;r.setProperty('--ac',c);
 const m=/^#?([0-9a-f]{6})$/i.exec(String(c).trim());
 if(m){const l=[0,2,4].map(i=>{const v=parseInt(m[1].substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  r.setProperty('--on',(.2126*l[0]+.7152*l[1]+.0722*l[2])>.7?'#10230f':'#fff')}}
function setUser(d,id){
 const{password,...u}=d||{};   /* la password non resta in memoria ne' nella copia locale */
 S.u={username:u.username,nome:u.nome,permissions:u.permissions||null};S.uid=id;S.ud=u;
 if(u.tema)setTema(u.tema);
}

/* ---------- FOTO GIOCATORE ----------
   Cartelle su GitHub: "foto giocatori/normali" (Home) e "foto giocatori/Esultanze" (La tua area).
   L'abbinamento si fa con il NOME COMPLETO del giocatore (campo "nome" dell'utente, es. "Riccardo Meggiato"),
   NON con lo username (che spesso e' un nickname). Il nome del file puo' essere scritto in molti modi:
   "Riccardo Meggiato.png", "riccardo_meggiato.jpg", "Meggiato Riccardo.webp", "RiccardoMeggiato.png" ... */
const GH="MarzenegoRiverside/MarzenegoWebpage",GBR="main",FBASE="https://raw.githubusercontent.com/"+GH+"/"+GBR+"/";
const FEXT=['png','jpg','jpeg','webp','PNG','JPG','JPEG'],FIMG=/\.(png|jpe?g|webp|gif|avif)$/i;
const nrm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const toks=x=>nrm(x).split(' ').filter(Boolean);
function pickFoto(files,nome){
 const nt=toks(nome);if(!nt.length)return'';
 const nj=nt.join(''),ns=[...nt].sort().join(' ');let best='',bs=0;
 files.forEach(f=>{const ft=toks(f.name.replace(/\.[^.]+$/,'')),fj=ft.join('');let sc=0;
  if([...ft].sort().join(' ')===ns)sc=100;                      /* stesso nome (anche cognome-nome) */
  else if(fj===nj)sc=95;                                         /* RiccardoMeggiato */
  else if(nt.every(t=>ft.includes(t)))sc=80-(ft.length-nt.length); /* nome + parole in piu' (es. "esultanza") */
  else if(nt.length>1&&fj.includes(nj))sc=60;
  if(sc>bs){bs=sc;best=f.url}});
 return best;
}
async function ghFiles(){
 const K='mzr_ft2',TTL=6*3600e3;let c=null;
 try{c=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
 if(c&&c.f&&c.f.length&&Date.now()-c.t<TTL)return c.f;
 try{
  const ac=typeof AbortController==='function'?new AbortController():null,tm=setTimeout(()=>ac&&ac.abort(),8000);
  let r;try{r=await fetch('https://api.github.com/repos/'+GH+'/git/trees/'+GBR+'?recursive=1',ac?{signal:ac.signal}:{})}finally{clearTimeout(tm)}
  if(!r.ok)throw 0;
  const j=await r.json(),f=(j.tree||[]).filter(x=>x.type==='blob'&&FIMG.test(x.path)&&/^foto[\s_-]*giocatori\//i.test(x.path)).map(x=>{const p=x.path.split('/');
   return{k:p.length<3?'':/^esult/i.test(p[1])?'Esultanze':/^normal/i.test(p[1])?'normali':'',name:p[p.length-1],url:FBASE+p.map(encodeURIComponent).join('/')}}).filter(x=>x.k);
  try{localStorage.setItem('mzr_ft2',JSON.stringify({t:Date.now(),f}))}catch(e){}
  return f;
 }catch(e){return c&&c.f?c.f:null}
}
/* S.fm.st: 0 = elenco foto in arrivo, 1 = elenco letto da GitHub, 2 = elenco non disponibile (si va per tentativi) */

 if(fs){['normali','Esultanze'].forEach(k=>{fm[k]=pickFoto(fs.filter(f=>f.k===k),nome)});fm.st=1}else fm.st=2;
}

let CARS=[];
function initCar(el){
 const cs=[...el.children],n=cs.length,key=el.dataset.p,GAP=5,SL=14,SC=.1,DY=12,
  TR=`transform .5s ${EZ},opacity .5s,z-index .5s,visibility .5s`,CT='opacity .38s ease';
 const cis=cs.map(c=>c.firstElementChild);
 let cur=(S.ci[key]||0)%n,pitch=0,W=0,dx=0,busy=0,act=0,dragged=0,sx=0,sy=0,st=0,last=0,pid=null,raf=0;
 const off=(i,c)=>{let d=((i-c)%n+n)%n;if(d>n/2)d-=n;return d};
 const wr=p=>{const h=n/2;while(p>h)p-=n;while(p<-h)p+=n;return p};
 let o=cs.map((_,i)=>off(i,cur));
 /* posizione di una card: p = distanza dal centro in "card" (0 = davanti, ±1 = laterali) */
 const pos=(i,p,a)=>{const c=cs[i],ci=cis[i],ap=Math.abs(p),t=Math.min(1,ap),sg=p<0?-1:1,
   tx=sg*(t*(W*SC/2+SL)+(ap>1?(ap-1)*W*.35:0));
  if(c._a!==a){c._a=a;c.style.transition=a?TR:'none';ci.style.transition=a?CT:'none'}
  c.style.transform=`translate3d(${tx.toFixed(1)}px,${(t*DY).toFixed(1)}px,0) scale(${(1-SC*t).toFixed(4)})`;
  c.style.opacity=Math.max(0,Math.min(1,(1.6-ap)/.6)).toFixed(2);
  c.style.visibility=ap>=1.6?'hidden':'visible';
  c.style.zIndex=Math.round(30-Math.min(2,ap)*10);
  c.style.pointerEvents=ap<.5?'':'none';
  ci.style.opacity=Math.max(0,1-t*1.7).toFixed(2);
  const sd=ap>=.999;if(c._sd!==sd){c._sd=sd;c.classList.toggle('sd',sd)}};
 const mark=()=>cs.forEach((c,i)=>c.classList.toggle('act',o[i]===0));
 const re=()=>{W=cs[0].offsetWidth;pitch=W+GAP;cs.forEach((_,i)=>pos(i,o[i],0));mark()};
 re();if(n<4)return{re};
 const frame=()=>{raf=0;const p=dx/pitch;cs.forEach((_,i)=>pos(i,wr(o[i]+p),0))};
 const settle=dir=>{
  busy=1;el.classList.add('mv');
  const nc=(cur+dir+n)%n,o1=cs.map((_,i)=>off(i,nc)),p=dx/pitch;dx=0;
  /* destinazione animata di ogni card; una card che "rientra" dal lato opposto parte da fuori scena (senza cloni) */
  const tg=cs.map((_,i)=>{const t=o1[i];
   if(Math.abs(t)>1.01)return o[i]-dir;
   if(Math.abs(wr(o[i]+p)-t)>1.5){pos(i,t+dir,0);return t}
   return t});
  el.offsetWidth;
  tg.forEach((t,i)=>pos(i,t,1));
  setTimeout(()=>{tg.forEach((t,i)=>{if(t!==o1[i])pos(i,o1[i],0)});o=o1;cur=nc;S.ci[key]=nc;mark();el.classList.remove('mv');busy=0},RM?20:530);
 };
 el.addEventListener('pointerdown',e=>{if(busy||(e.pointerType==='mouse'&&e.button!==0))return;sx=e.clientX;sy=e.clientY;st=performance.now();act=1;dragged=0;dx=0;pid=e.pointerId});
 el.addEventListener('pointermove',e=>{if(!act)return;const mx=e.clientX-sx,my=e.clientY-sy;
  if(!dragged){if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)*1.2){dragged=1;el.classList.add('mv');try{el.setPointerCapture(pid)}catch(x){}}else{if(Math.abs(my)>8)act=0;return}}
  dx=mx;if(!raf)raf=requestAnimationFrame(frame)});
 const end=()=>{if(!act)return;act=0;if(!dragged)return;
  if(raf){cancelAnimationFrame(raf);raf=0}
  const now=performance.now(),v=dx/Math.max(1,now-st);last=now;let dir=0;if(Math.abs(dx)>pitch*.2||Math.abs(v)>.5)dir=dx<0?1:-1;
  if(dir)settle(dir);
  else{busy=1;const p=dx/pitch;dx=0;cs.forEach((_,i)=>{const r=o[i]+p;pos(i,o[i],Math.abs(wr(r)-r)<.01?1:0)});setTimeout(()=>{busy=0;el.classList.remove('mv')},RM?20:520)}};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
 el.addEventListener('click',e=>{if(performance.now()-last<350){e.stopPropagation();e.preventDefault()}},true);
 el.addEventListener('click',e=>{if(busy||e.target!==el)return;const r=el.getBoundingClientRect();settle(e.clientX<r.left+r.width/2?-1:1)});
 return{re};
}

  glassCard(`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div class="t" style="font-size:30px">Mancanza voti</div><div class="ct">${tri(on,22)}<span>${m.w}</span></div></div><div class="st" style="margin-bottom:18px">Attenzione:</div><div class="s">Voti mancanti nei prossimi 7 giorni:</div><div class="row" style="margin:6px 4px 16px"><span style="flex:1">Voti mancanti:</span><span class="cap${on?'':' gn'}">${m.w}</span></div><div class="s">In generale:</div><div class="row" style="margin:6px 4px 18px"><span style="flex:1">Voti mancanti:</span><span class="cap">${m.t}</span></div>${on?'<button class="btn" data-a="votiGo" style="margin-top:22px">Sana situazione</button>':'<button class="btn gn" data-a="close" style="margin-top:22px">Ottimo lavoro campione!</button>'}<button class="btn gh" data-a="close">Indietro</button>`)},
 votiGo:()=>{closeM();go('cal')},
 logout:()=>{if(!confirm("Vuoi uscire dal tuo account?"))return;
  try{localStorage.removeItem(SK);sessionStorage.removeItem(SK)}catch(e){}dropUserCache();
  S.ss=null;S.u=null;S.uid=null;S.ud={};S.fm={};S.votes=null;S.vst=null;S.msgs=[];S.cand=[];S.ord=[];setTema(TEMA_DEF);go('home')},
 user:()=>{if(!S.u)return loginM();go(S.page==='area'?S.prev:'area')},
 mo:v=>{S.mo=new Date(S.mo.getFullYear(),S.mo.getMonth()+ +v,1);render();if(!RM)$('.cg')?.animate([{opacity:0,transform:`translateX(${+v>0?16:-16}px)`},{opacity:1,transform:'none'}],{duration:340,easing:EZ})},
 news:v=>{const x=S.D.news.find(n=>n.id===v);if(!x)return;
  glassCard(`<div class="t" style="font-size:30px;margin-bottom:4px">${E(x.titolo)}</div><div class="st" style="font-size:18px;margin-bottom:18px">${E(x.data||'')}</div><div class="nbody">${E(x.testo||'')}</div><button class="btn" data-a="close" style="margin-top:22px">Torna indietro</button>`)},
 openEv:v=>{if(S.busy)return;S.busy=1;Promise.resolve(evModal(v)).finally(()=>S.busy=0)},tab:v=>{if(S.busy)return;const[i,t]=v.split('|');S.busy=1;Promise.resolve(evModal(i,t)).finally(()=>S.busy=0)},
 vota:async v=>{const[i,s]=v.split('|');if(!S.u){closeM();return loginM()}
  const ok=$('.vt .ok'),ko=$('.vt .ko'),prev=ok&&ok.classList.contains('sel')?'presente':ko&&ko.classList.contains('sel')?'assente':null;
  const paint=paintVote;
  paint(s);const n=S.vn=(S.vn||0)+1;
  try{await W(()=>setDoc(doc(db,"presenze",i+"_"+S.u.username),{eventoId:i,username:S.u.username,nome:S.u.nome,stato:s,timestamp:Date.now()}))}
  catch(e){if(n===S.vn)paint(prev);return alert("Errore salvataggio voto: "+e.message)}
  if(S.vst)S.vst.set(i,s);
  if(S.votes){S.votes.add(i);hdr()}
  if(n!==S.vn)return;
  const t=$('.pill[data-a=tab]:not(.off)')?.dataset.v.split('|')[1]||'r';if(t==='p')evModal(i,t)},
 login:async()=>{const u=$('#lu').value.trim(),p=$('#lp').value.trim();if(!u||!p)return alert("Inserisci username e password");
  try{await withTO(fbReady(),20000);const s=await withTO(getDocs(query(collection(db,"utenti"),where("username","==",u),where("password","==",p))),20000);
   if(s.empty)return alert(s.metadata.fromCache?"Connessione assente, riprova tra poco":"Credenziali errate");
   const d=s.docs[0].data(),rc=$('#lr').checked;await applyUser(d,s.docs[0].id);
   try{localStorage.removeItem(SK);sessionStorage.removeItem(SK);(rc?localStorage:sessionStorage).setItem(SK,JSON.stringify({type:"player",username:d.username,nome:d.nome,ruolo:d.ruolo||"",permissions:d.permissions||null}))}catch(e){}
   S.ss=d.username;dropUserCache();cacheUser();
   closeM();go('area')}catch(e){alert(e&&e.message==='timeout'?"Connessione lenta, riprova tra poco":"Errore: "+e.message)}},
 pin:async v=>{if(!S.u)return loginM();const x=S.D.eventiExtra.find(e=>e.id===v),n=S.ud.noteEventi||[];
  S.ud.noteEventi=n.includes(x.testo)?n.filter(t=>t!==x.testo):[...n,x.testo];render();save({noteEventi:S.ud.noteEventi})},
 cand:async v=>{if(!S.u)return loginM();const x=S.D.posizioni.find(p=>p.id===v);
  try{await W(()=>addDoc(collection(db,"candidature"),{nome:S.u.nome,posizione:x.testo,data:ymd(new Date())}))}catch(e){return alert("Errore: "+e.message)}
  try{S.cand=await fetchEq('candidature','nome',S.u.nome)}catch(e){}render();alert("Candidatura inviata con successo!")},
 stab:v=>{S.shopTab=v;render()},
 ottieni:v=>{if(!S.u)return loginM();const p=S.D.prodotti.find(x=>x.id===v);
  glassCard(`<div class="t" style="font-size:26px;margin-bottom:12px">Ottieni articolo</div><div class="li" style="margin:0">“${E(p.nome)}”</div><u class="li">“${E(p.prezzo)}€”</u><div class="row" style="margin:8px 4px"><b style="flex:none;font-size:14px">Quantità:</b><input class="in" id="oq" type="number" min="1" value="1" style="width:64px;padding:2px 8px;margin:0;border-radius:14px;text-align:center"></div><div class="row" style="margin:8px 4px"><b style="flex:none;font-size:14px">Taglia:</b><input class="in" id="ot" placeholder="#" style="width:64px;padding:2px 8px;margin:0;border-radius:14px;text-align:center"></div><button class="btn" data-a="ordina" data-v="${v}" style="margin-top:22px">Conferma ordine</button>`)},
 ordina:async v=>{const p=S.D.prodotti.find(x=>x.id===v),t=$('#ot').value.trim();if(!t)return alert("Inserisci la taglia");
  const q=+$('#oq').value||1;
  try{await W(()=>addDoc(collection(db,"richieste_prodotti"),{prodottoId:v,prodottoNome:p.nome,nomeUtente:S.u.nome,taglia:t,quantita:q,data:ymd(new Date())}))}catch(e){return alert("Errore: "+e.message)}
  try{S.ord=await fetchEq('richieste_prodotti','nomeUtente',S.u.nome)}catch(e){}closeM();render();alert("Richiesta inviata!")},
 letti:async()=>{try{for(const m of S.msgs.filter(m=>!m.letto)){await W(()=>updateDoc(doc(db,"messaggi",m.id),{letto:true}));m.letto=true}}catch(e){}},
 salva:()=>{const a={};document.querySelectorAll('[data-k]').forEach(i=>a[i.dataset.k]=i.checked);
  S.ud.assets=a;S.ud.numeroMaglia=$('#nm').value.trim();S.ud.scadenzaVisita=$('#vm').value;
  save({assets:a,numeroMaglia:S.ud.numeroMaglia,scadenzaVisita:S.ud.scadenzaVisita});alert("Salvato")},
 tema:()=>{const cur=getComputedStyle(document.documentElement).getPropertyValue('--ac').trim().toLowerCase(),pl=c=>`<span class="tc" data-a="pickT" data-v="${c}" style="display:block;background:${c};cursor:pointer;outline:${c.toLowerCase()===cur?'2px solid #fff':'0'};outline-offset:2px"></span>`;
  glassCard(`<div class="t" style="font-size:30px">La tua area</div><div class="st" style="margin-bottom:16px">Cambia tema app</div><div class="row" style="margin-bottom:10px"><b style="flex:none;font-size:15px;font-weight:500">Default:</b>${pl(TEMA_DEF)}<span style="flex:1"></span></div><div class="row" style="margin:14px 4px 0"><b style="font-size:15px;font-weight:500">Altri:</b></div><div class="tgr">${TEMI.map(pl).join('')}</div><button class="btn" data-a="close" style="margin-top:26px">Imposta</button>`)},
 pickT:v=>{setTema(v);S.ud.tema=v;save({tema:v});A.tema()},
 fotoBtn:()=>$('#foto').click(),
 fotoDel:()=>{if(!S.ud.fotoProfilo)return alert("Non hai una foto profilo da rimuovere");if(!confirm("Rimuovere la foto profilo?"))return;S.ud.fotoProfilo='';save({fotoProfilo:''});render()},
 pwa:async()=>{if(matchMedia('(display-mode:standalone)').matches||navigator.standalone)return alert("L'app è già installata");
  if(DP){DP.prompt();await DP.userChoice;DP=null;return}
  alert(/iphone|ipad|ipod/i.test(navigator.userAgent)?"Per installare l'app su iPhone:\n\n1. Apri questa pagina con Safari\n2. Tocca Condividi ↑\n3. \"Aggiungi alla schermata Home\"\n4. Lascia attivo \"Apri come app web\" e tocca Aggiungi":"Per installare l'app:\n\nApri il menu del browser ⋮\n→ scegli \"Installa app\"\n\n(non \"Aggiungi a schermata Home\": crea solo un collegamento che si apre come scheda del browser)")},
 contratto:()=>glassCard(`<div class="t" style="font-size:30px">La tua area</div><div class="st" style="margin-bottom:14px">Il tuo contratto</div><div class="li" style="font-size:16px;opacity:1">Durata 1 anno<br>Premi: nessuno<br>Multe:<br>Cartellino giallo 10 euro<br>Cartellino rosso 15 euro</div><button class="btn" data-a="close" style="margin-top:110px">Torna indietro</button>`)
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='INPUT')return;if(t.classList.contains('ov')&&e.target!==t)return;A[t.dataset.a]?.(t.dataset.v)});
document.addEventListener('change',e=>{if(e.target.dataset.a==='letti'&&e.target.checked)A.letti()});
$('#foto').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
 const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),m=Math.min(i.width,i.height);x.drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,160,160);
 S.ud.fotoProfilo=c.toDataURL('image/jpeg',.8);save({fotoProfilo:S.ud.fotoProfilo});render()};i.src=r.result};r.readAsDataURL(f)});

(async()=>{
 let ss=null;try{ss=JSON.parse(localStorage.getItem(SK)||sessionStorage.getItem(SK)||'null')}catch(e){}
 /* 1) subito: dati e profilo salvati dall'ultima apertura (nessuna attesa di rete) */
 loadCache();
 if(ss&&ss.type==="player"&&ss.username){S.ss=ss.username;const c=cachedUser(ss.username);if(c){setUser(c.d,c.id);resolveFoto().then(patchFoto).catch(()=>{})}}
 try{const pg=sessionStorage.getItem('mzr_pg');if(pg){sessionStorage.removeItem('mzr_pg');if(PAGES.some(p=>p[0]===pg)||(pg==='area'&&S.u))S.page=pg}}catch(e){}
 render();

 refresh();
})();
