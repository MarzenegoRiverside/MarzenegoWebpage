<script>
/* ============================================================
   ICONA DELL'APP (Android + iPhone) — PUNTO UNICO DI MODIFICA
   Incolla qui il RAW LINK GitHub dell'icona, tra le virgolette.
   Esempio:
   "https://raw.githubusercontent.com/MarzenegoRiverside/MarzenegoWebpage/main/icon-512.png"
   Consigli: PNG quadrato 512x512 (o 1024x1024), senza trasparenza per iPhone.
   Se lasci vuoto "" viene usato il file apple-touch-icon.png del repository.
   ============================================================ */
var APP_ICON_URL = "https://raw.githubusercontent.com/MarzenegoRiverside/MarzenegoWebpage/main/apple-touch-icon.png";
/* Metti true solo se l'icona ha ~20% di margine attorno al logo (icona "maskable") */
var APP_ICON_MASKABLE = true;

/* Da qui in poi non serve modificare nulla */
(function(){
  try{
    var base = new URL('./', location.href).href;
    var icon = APP_ICON_URL ? new URL(APP_ICON_URL, base).href : new URL('apple-touch-icon.png', base).href;
    var purpose = APP_ICON_MASKABLE ? 'maskable' : 'any';
    var manifest = {
      id: base,
      name: 'Marzenego Riverside',
      short_name: 'Marzenego',
      lang: 'it',
      start_url: base,
      scope: base,
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#000000',
      theme_color: '#0a2a12',
      icons: [
        {src: icon, sizes: '192x192', type: 'image/png', purpose: purpose},
        {src: icon, sizes: '512x512', type: 'image/png', purpose: purpose}
      ]
    };
    var blobUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'}));
    var m = document.querySelector('link[rel="manifest"]');
    if(!m){ m = document.createElement('link'); m.rel = 'manifest'; document.head.appendChild(m); }
    m.href = blobUrl;
    var ati = document.querySelector('link[rel="apple-touch-icon"]');
    if(!ati){ ati = document.createElement('link'); ati.rel = 'apple-touch-icon'; document.head.appendChild(ati); }
    ati.href = icon;
    var fav = document.querySelector('link[rel="icon"]');
    if(!fav){ fav = document.createElement('link'); fav.rel = 'icon'; document.head.appendChild(fav); }
    fav.href = icon;
  }catch(e){ console.warn('Manifest dinamico non creato', e); }
  /* iPhone: la barra in alto prende il colore da qui (solo iOS, Android invariato) */
  try{ if(window.CSS&&CSS.supports('-webkit-touch-callout','none')){ var tc=document.querySelector('meta[name="theme-color"]'); if(tc) tc.setAttribute('content','#1b6b34'); } }catch(e){}
  /* Service worker minimale (file sw.js nella stessa cartella): richiesto da Chrome per "Installa app" */
  if('serviceWorker' in navigator){
    addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>

<script type="module">

const db=getFirestore(initializeApp({apiKey:"AIzaSyCvqU28XLWRsfJUso0MuS72O2Qxks-MFP0",authDomain:"marzenego-2e266.firebaseapp.com",projectId:"marzenego-2e266",storageBucket:"marzenego-2e266.appspot.com"}));
const $=(s,r=document)=>r.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,EZ='cubic-bezier(.22,1,.36,1)',SPR='cubic-bezier(.3,1.5,.5,1)';

 (await Promise.all(n.map(col))).forEach((r,i)=>S.D[n[i]]=r);

  getDocs(query(collection(db,"messaggi"),where("destinatario","==",S.u.username))).then(s=>s.docs.map(d=>({id:d.id,...d.data()}))).catch(()=>[]),

  getDocs(query(collection(db,"presenze"),where("username","==",S.u.username))).then(s=>new Set(s.docs.map(d=>d.data().eventoId))).catch(()=>null)]);
 S.votes=vt;S.msgs=m.sort((a,b)=>b.timestamp-a.timestamp);
 S.cand=c.filter(x=>x.nome===S.u.nome);S.ord=o.filter(x=>x.nomeUtente===S.u.nome);

 if(m){const l=[0,2,4].map(i=>{const v=parseInt(m[1].substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  r.setProperty('--on',(.2126*l[0]+.7152*l[1]+.0722*l[2])>.7?'#10230f':'#fff')}}
async function applyUser(d,id){

/* ---------- VOTI MANCANTI ---------- */
function miss(){

 const t=new Date(),a=ymd(t),z=ymd(new Date(t.getFullYear(),t.getMonth(),t.getDate()+6));

 else{hr.className='hr';al.style.display='none';al.innerHTML=''}
 const b=$('#usr'),was=b.classList.contains('lgd');
 if(S.u){const ar=S.page==='area';b.className='usr lgd'+(ar?' cls':'');b.setAttribute('aria-label',ar?'Chiudi La tua area':'La tua area');b.innerHTML=`<span class="uph">${S.ud.fotoProfilo?`<img src="${S.ud.fotoProfilo}">`:E(ini())}</span>`+(ar?'<span class="x" aria-hidden="true">X</span>':'');if(!was&&!RM)b.animate([{transform:'scale(.7)',opacity:.4},{transform:'scale(1)',opacity:1}],{duration:480,easing:SPR})}

}

}
function sec(){
 const t=new Date(),ne=nextEv(),b=new Date(t.getFullYear(),t.getMonth(),t.getDate()+S.wo);let h='';
 const MS=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
 const d0=new Date(b.getFullYear(),b.getMonth(),b.getDate()-2),d5=new Date(b.getFullYear(),b.getMonth(),b.getDate()+3);
 for(let i=-2;i<4;i++){const d=new Date(b.getFullYear(),b.getMonth(),b.getDate()+i);h+=`<div class="dy d${Math.abs(i)}${d.toDateString()===t.toDateString()?' on':''}"><b>${'DLMMGVS'[d.getDay()]}</b><span>${p2(d.getDate())}</span></div>`}
 const lab=d0.getMonth()===d5.getMonth()?MESI[d5.getMonth()]+' '+d5.getFullYear():MS[d0.getMonth()]+' – '+MS[d5.getMonth()]+' '+d5.getFullYear();
 const nt=ne?`${E(ne.tipo)} ${ne.data.slice(8)}/${ne.data.slice(5,7)}`:'nessun evento';
 return `<div class="stack" id="secw"><div class="back"><span class="nx" style="text-decoration:none">Next: ${nt}</span></div><div class="front glass lq"><div class="wm"><button class="wa" data-a="wk" data-v="-1" aria-label="Settimana precedente">‹</button><b>${lab}</b><button class="wa" data-a="wk" data-v="1" aria-label="Settimana successiva">›</button></div><div class="wk">${h}</div></div></div>`;
}

/* ---------- FOTO GIOCATORE ----------
   Cartelle su GitHub: "foto giocatori/normali" (Home) e "foto giocatori/Esultanze" (La tua area).
   L'abbinamento si fa con il NOME COMPLETO del giocatore (campo "nome" dell'utente, es. "Riccardo Meggiato"),
   NON con lo username (che spesso e' un nickname). Il nome del file puo' essere scritto in molti modi:
   "Riccardo Meggiato.png", "riccardo_meggiato.jpg", "Meggiato Riccardo.webp", "RiccardoMeggiato.png" ... */
const GH="MarzenegoRiverside/MarzenegoWebpage",GBR="main",FBASE="https://raw.githubusercontent.com/"+GH+"/"+GBR+"/";
const FEXT=['png','jpg','jpeg','webp','PNG','JPG','JPEG'],FIMG=/\.(png|jpe?g|webp|gif|avif)$/i;
const nrm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const toks=x=>nrm(x).split(' ').filter(Boolean);
function pickFoto(files,nome){
 const nt=toks(nome);if(!nt.length)return'';
 const nj=nt.join(''),ns=[...nt].sort().join(' ');let best='',bs=0;
 files.forEach(f=>{const ft=toks(f.name.replace(/\.[^.]+$/,'')),fj=ft.join('');let sc=0;
  if([...ft].sort().join(' ')===ns)sc=100;                      /* stesso nome (anche cognome-nome) */
  else if(fj===nj)sc=95;                                         /* RiccardoMeggiato */
  else if(nt.every(t=>ft.includes(t)))sc=80-(ft.length-nt.length); /* nome + parole in piu' (es. "esultanza") */
  else if(nt.length>1&&fj.includes(nj))sc=60;
  if(sc>bs){bs=sc;best=f.url}});
 return best;
}
async function ghFiles(){
 const K='mzr_ft2',TTL=6*3600e3;let c=null;
 try{c=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
 if(c&&c.f&&c.f.length&&Date.now()-c.t<TTL)return c.f;
 try{
  const r=await fetch('https://api.github.com/repos/'+GH+'/git/trees/'+GBR+'?recursive=1');if(!r.ok)throw 0;
  const j=await r.json(),f=(j.tree||[]).filter(x=>x.type==='blob'&&FIMG.test(x.path)&&/^foto[\s_-]*giocatori\//i.test(x.path)).map(x=>{const p=x.path.split('/');
   return{k:p.length<3?'':/^esult/i.test(p[1])?'Esultanze':/^normal/i.test(p[1])?'normali':'',name:p[p.length-1],url:FBASE+p.map(encodeURIComponent).join('/')}}).filter(x=>x.k);
  try{localStorage.setItem('mzr_ft2',JSON.stringify({t:Date.now(),f}))}catch(e){}
  return f;
 }catch(e){return c&&c.f?c.f:[]}
}
async function resolveFoto(){
 S.fm={normali:'',Esultanze:''};if(!S.u||!S.u.nome)return;
 const fs=await ghFiles();['normali','Esultanze'].forEach(k=>{S.fm[k]=pickFoto(fs.filter(f=>f.k===k),S.u.nome)});
}
function fotoList(k){
 if(!S.u)return[];
 const f=k==='normali'?S.ud.fotoHome:S.ud.fotoEsultanza,ck='mzr_f_'+k+'_'+S.u.username;
 let c='';try{c=localStorage.getItem(ck)||''}catch(e){}
 const nm=String(S.u.nome||'').trim().replace(/\s+/g,' '),lo=nm.toLowerCase(),cap=lo.replace(/(^|\s)\S/g,m=>m.toUpperCase());
 const base=nm?[...new Set([nm,cap,lo,nm.replace(/ /g,'_'),lo.replace(/ /g,'_'),cap.replace(/ /g,'_'),cap.replace(/ /g,''),lo.replace(/ /g,''),lo.replace(/ /g,'-')])]:[];
 const u=[];if(f)u.push(f);if(S.fm&&S.fm[k])u.push(S.fm[k]);if(c)u.push(c);
 base.forEach(b=>FEXT.forEach(x=>u.push(FBASE+'foto%20giocatori/'+(k==='normali'?'normali/':'Esultanze/')+encodeURIComponent(b)+'.'+x)));
 return[...new Set(u)];
}
window.fN=img=>{const k=img.dataset.k,l=S.fl[k]||[],i=(+img.dataset.i||0)+1;if(i<l.length){img.dataset.i=i;img.src=l[i]}else{img.onerror=null;img.remove()}};
window.fO=img=>{try{localStorage.setItem('mzr_f_'+img.dataset.k+'_'+S.u.username,img.currentSrc||img.src)}catch(e){}};
const fotoImg=(k,cls)=>{const l=fotoList(k);if(!l.length)return'';S.fl[k]=l;return `<img class="${cls}" data-k="${k}" data-i="0" src="${E(l[0])}" alt="" onerror="fN(this)" onload="fO(this)">`};
/* ---------- PRONOSTICO ---------- */
const STOP=/^(asd|ssd|a\.s\.d\.?|s\.s\.d\.?|fc|f\.c\.|ac|a\.c\.|us|u\.s\.|sc|pol|pol\.|polisportiva|gs|g\.s\.|srl|a|di|del|della|de|la|il|e|&|vs)$/i;
function inits(n){let w=String(n).replace(/[^\p{L}\p{N}\s.'’-]/gu,' ').split(/[\s-]+/).filter(Boolean);const k=w.filter(x=>!STOP.test(x));if(k.length)w=k;
 return w.length>1?w.slice(0,3).map(x=>x[0]).join('').toUpperCase():(w[0]||'?')[0].toUpperCase()}
const crest=(n,sz=40)=>{const t=inits(n),fs=t.length>2?15:t.length>1?19:24;return `<svg class="crest" viewBox="0 0 48 56" width="${sz}" height="${Math.round(sz*56/48)}"><path d="M24 2 44 8v20c0 13-9 22-20 26C13 50 4 41 4 28V8z" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.75)" stroke-width="2"/><text x="24" y="${t.length>2?33:35}" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="800" font-size="${fs}" fill="#EEF3E8">${E(t)}</text></svg>`};
const oppName=e=>{const c=[e.avversario,e.avversaria,e.squadraAvversaria,e.squadra,e.titolo,e.nome,e.vs].find(x=>x&&String(x).trim());if(c)return String(c).trim();
 const n=String(e.note||''),m=/(?:\bvs\.?|\bcontro\b|\bv\/s\b)\s+([^\n,;.(]+)/i.exec(n);if(m)return m[1].trim();const f=n.split('\n')[0].trim();return f&&f.length<=40?f:'Avversario'};
function betMatch(){const t=new Date(),y=ymd(new Date(t.getFullYear(),t.getMonth(),t.getDate()-1));return S.D.eventi.find(e=>e.tipo==='Partita'&&e.data>=y)}
const BK=id=>'mzr_bet_'+(S.u?S.u.username:'ospite')+'_'+id;
const getBet=id=>{try{return JSON.parse(localStorage.getItem(BK(id))||'null')}catch(e){return null}};

 `<div class="bt"><b>Primo nutria in gol</b><input class="bp" id="bn" placeholder="Inserisci nome" maxlength="40" value="${E(b.n||'')}"></div>

 <div class="bt"><b>Vince il Marzenego?</b><span class="bp bs"><u data-a="bw" data-v="Si" class="${b.w==='Si'?'sel':''}">Si</u>/<u data-a="bw" data-v="No" class="${b.w==='No'?'sel':''}">No</u></span></div>
 <div class="li" style="text-align:center;margin:16px 0 4px;font-size:14px">Gioca responsabilmente</div>
 <button class="btn" data-a="betOk">Conferma pronostico</button><button class="btn gh" data-a="close">Indietro</button>`);
}
function betSum(e,b){
 const R=[];if(b.n)R.push(['Primo nutria in gol',E(b.n)]);if(b.g1!==''&&b.g2!=='')R.push(['Risultato finale esatto',E(b.g1)+' - '+E(b.g2)]);if(b.w)R.push(['Vince il Marzenego?',b.w]);
 glassCard(betHead(e,'Il tuo pronostico','Resoconto:')+R.map(([l,v])=>`<div class="bt"><b>${l}</b><span class="pill bv">${v}</span></div>`).join('')+
 `<div class="li" style="text-align:center;margin:16px 0 4px;font-size:14px">Hai azzeccato?</div>
 <button class="btn gn" data-a="betShare" style="line-height:1.2">CONDIVIDI PRONOSTICO<br><span style="font-size:12px;font-weight:400">e riscuoti la vincita</span></button><button class="btn gh" data-a="betEdit">Indietro</button>`);
}

let CARS=[];
function initCar(el){
 const cs=[...el.children],n=cs.length,key=el.dataset.p,GAP=5;
 let cur=S.ci[key]||0,pitch=0,dx=0,busy=0,act=0,dragged=0,sx=0,sy=0,st=0,last=0,pid=null;
 const off=(i,c)=>{let d=((i-c)%n+n)%n;if(d>n/2)d-=n;return d};
 let o=cs.map((_,i)=>off(i,cur));
 const SL=14,SC=.1,DY=12;
 const pos=(c,p,a)=>{const ap=Math.abs(p),sg=p<0?-1:1,t=Math.min(1,ap),w=c.offsetWidth||cs[0].offsetWidth,off=w*SC/2+SL,tx=sg*(t*off+(ap>1?(ap-1)*w*.35:0));
  c.style.transition=a?`transform .5s ${EZ},opacity .5s,z-index .5s`:'none';
  c.style.transform=`translate3d(${tx.toFixed(1)}px,${(t*DY).toFixed(1)}px,0) scale(${(1-SC*t).toFixed(4)})`;
  c.style.setProperty('--f',t.toFixed(3));
  c.style.opacity=Math.max(0,Math.min(1,(1.6-ap)/.6)).toFixed(2);
  c.style.zIndex=Math.round(30-Math.min(2,ap)*10);
  c.style.pointerEvents=ap<.5?'':'none'};
 const re=()=>{pitch=cs[0].offsetWidth+GAP;cs.forEach((c,i)=>pos(c,o[i],0))};
 re();if(n<3)return{re};
 const settle=dir=>{
  busy=1;const nc=(cur+dir+n)%n,o1=cs.map((_,i)=>off(i,nc)),gh=[];
  cs.forEach((c,i)=>{const ex=o[i]-dir;pos(c,ex,1);
   if(o1[i]!==ex&&Math.abs(o1[i])<=1){const g=c.cloneNode(true);g.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));g.setAttribute('aria-hidden','true');g.classList.add('gh');el.appendChild(g);pos(g,o1[i]+dir,0);g.offsetWidth;pos(g,o1[i],1);gh.push(g)}});
  setTimeout(()=>{gh.forEach(g=>g.remove());cs.forEach((c,i)=>{if(o1[i]!==o[i]-dir)pos(c,o1[i],0)});o=o1;cur=nc;S.ci[key]=nc;busy=0},RM?20:530);
 };
 el.addEventListener('pointerdown',e=>{if(busy||(e.pointerType==='mouse'&&e.button!==0))return;sx=e.clientX;sy=e.clientY;st=performance.now();act=1;dragged=0;dx=0;pid=e.pointerId});
 el.addEventListener('pointermove',e=>{if(!act)return;const mx=e.clientX-sx,my=e.clientY-sy;
  if(!dragged){if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)*1.2){dragged=1;el.classList.add('dg');try{el.setPointerCapture(pid)}catch(x){}}else{if(Math.abs(my)>8)act=0;return}}
  dx=mx;cs.forEach((c,i)=>pos(c,o[i]+dx/pitch,0))});
 const end=()=>{if(!act)return;act=0;if(!dragged)return;el.classList.remove('dg');last=performance.now();
  const v=dx/Math.max(1,performance.now()-st);let dir=0;if(Math.abs(dx)>pitch*.2||Math.abs(v)>.5)dir=dx<0?1:-1;dx=0;
  if(dir)settle(dir);else{busy=1;cs.forEach((c,i)=>pos(c,o[i],1));setTimeout(()=>busy=0,520)}};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
 el.addEventListener('click',e=>{if(performance.now()-last<350){e.stopPropagation();e.preventDefault()}},true);
 el.addEventListener('click',e=>{if(busy||e.target!==el)return;const r=el.getBoundingClientRect();settle(e.clientX<r.left+r.width/2?-1:1)});
 return{re};
}
